[package]
name = "anonym-proxy"
version = "0.1.0"
edition = "2024"
description = "A high-performance anonymous proxy server"
authors = []
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }

# HTTP client & server
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# TLS support
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.7"

# Networking
tokio-socks = "0.5"       # SOCKS4/5 support
trust-dns-resolver = "0.23"  # Async DNS

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Bytes & IO
bytes = "1.11"
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Metrics (opcional)
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
